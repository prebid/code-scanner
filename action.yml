name: "Prebid Code Scanner"
description: "Scan code for suspect patterns submitted by Prebid member companies"
branding:
  icon: "check-circle"
  color: "yellow"
inputs:
  token:
    description: Github token
    required: true
  patterns:
    description: Glob patterns to scan, comma-separated
    required: false
    default: "**/*"
  ignores:
    description: Glob patterns to ignore, comma-separated
    required: false
    default: '.git/**'
  root:
    description: Source root
    required: false
    default: '.'
  pem:
    description: App secret
    required: true
  appId:
    description: App ID
    required: true
  installationId:
    description: App installation Id
    required: true
  pr:
    description: >
      PR number to report results against. Defaults to the triggering pull request, if any;
      set it when running from workflow_run.
    required: false
  sha:
    description: Commit that was checked out and scanned. Defaults to the PR's current head.
    required: false

runs:
  using: "node24"
  main: "dist/index.js"